name: CI

# Release PRs pass the same checks as other changes before they reach main.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --bun vp check
      - run: bun run typecheck
      - run: bun test
      # The MCP README tool table is generated from source; fail if stale.
      - name: MCP tool docs up to date
        run: cd packages/mcp && bun run scripts/generate-tool-docs.ts --check
      # cli and mcp publish bundled output (prepack). Pack a dry-run tarball
      # so a broken bundle or a runtime workspace: specifier fails PR CI
      # instead of the next release.
      - name: CLI pack smoke test
        run: |
          cd packages/cli && npm pack --pack-destination /tmp
          tar -xzOf /tmp/moor-sh-cli-*.tgz package/package.json | bun -e '
            const pkg = await Bun.stdin.json();
            const runtime = [pkg.dependencies, pkg.optionalDependencies, pkg.peerDependencies];
            if (runtime.some(deps => Object.values(deps ?? {}).some(value => value.startsWith("workspace:")))) process.exit(1);
          '
          tar -tzf /tmp/moor-sh-cli-*.tgz | grep -q "package/dist/index.js"
      - name: MCP pack smoke test
        run: |
          cd packages/mcp && npm pack --pack-destination /tmp
          tar -xzOf /tmp/moor-sh-mcp-*.tgz package/package.json | bun -e '
            const pkg = await Bun.stdin.json();
            const runtime = [pkg.dependencies, pkg.optionalDependencies, pkg.peerDependencies];
            if (runtime.some(deps => Object.values(deps ?? {}).some(value => value.startsWith("workspace:")))) process.exit(1);
          '
          tar -tzf /tmp/moor-sh-mcp-*.tgz | grep -q "package/dist/index.js"
      # Validate the privileged respawner before a release PR can merge.
      - name: Build moor-respawner (test only)
        run: docker build -t moor-respawner-test apps/respawner
      - name: Respawner self-test
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock moor-respawner-test --self-test
