name: Release MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/mcp/**"
      - "packages/contract/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --bun vp check packages/mcp packages/contract
      - run: bun run --cwd packages/mcp typecheck
      - name: MCP pack smoke test
        run: |
          cd packages/mcp && npm pack --pack-destination /tmp
          tar -xzOf /tmp/moor-sh-mcp-*.tgz package/package.json | (! grep -q "workspace:")
          tar -tzf /tmp/moor-sh-mcp-*.tgz | grep -q "package/dist/index.js"

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd packages/mcp && bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
