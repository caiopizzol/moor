pre-commit:
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,css}"
      run: bunx biome check --write {staged_files} && git add {staged_files}
    typecheck-api:
      glob: "apps/api/**/*.ts"
      run: bun run --cwd apps/api typecheck
    typecheck-web:
      glob: "apps/web/**/*.{ts,tsx}"
      run: bun run --cwd apps/web typecheck
    typecheck-contract:
      glob: "packages/contract/**/*.ts"
      run: bun run --cwd packages/contract typecheck
    typecheck-cli:
      glob: "packages/cli/**/*.ts"
      run: bun run --cwd packages/cli typecheck
    typecheck-mcp:
      glob: "packages/mcp/**/*.ts"
      run: bun run --cwd packages/mcp typecheck
